[project]
name = "dev-jujucollins-site"
version = "0.0.0"
description = "Browser tests for the portfolio. The site itself has no build step or runtime dependencies."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "pytest>=9.1",
    "pytest-playwright>=0.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/e2e"]
# Quiet mode turns on the one-line-per-test output in tests/conftest.py; pass -v for
# pytest's standard lines. JUnit XML (xunit1 keeps file and line) feeds the CI summary.
addopts = [
    "-q",
    "-ra",
    "--tb=short",
    "--junitxml=test-results/pytest-junit.xml",
    "--browser=chromium",
    "--tracing=retain-on-failure",
    "--screenshot=only-on-failure",
    "--output=test-results",
]
console_output_style = "classic"
junit_family = "xunit1"
