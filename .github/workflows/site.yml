name: Site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check scripts/main.js

      # Readable results in the log, plus JUnit XML for the summary below.
      - name: Run unit tests
        run: >-
          mkdir -p test-results &&
          node --test
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=test-results/node-junit.xml
          tests/main.test.cjs

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install test dependencies
        run: uv sync --locked --quiet

      # Headless Chromium only. The runner already has its system libraries;
      # --with-deps spent ~3 minutes downloading CJK and other fonts this
      # English site, which ships its own font, never uses.
      - name: Install Chromium for Playwright
        run: uv run playwright install --only-shell chromium

      # Runs even if the unit tests failed, so one run reports everything.
      - name: Run browser and accessibility tests
        if: ${{ !cancelled() }}
        run: uv run pytest

      # Results table on the run page, and each failure flagged on its line.
      - name: Summarize results
        if: ${{ !cancelled() }}
        run: python3 tests/ci_report.py --summary "$GITHUB_STEP_SUMMARY" test-results/*.xml

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Publish only the site itself, not tests, tooling, or docs.
      - name: Collect public files
        run: |
          mkdir _site
          cp -R index.html 404.html robots.txt sitemap.xml assets scripts styles _site/
          find _site -name .DS_Store -delete

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
